[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uniswap-v3-lp-simulator"
version = "0.2.0"
description = "Event-driven Uniswap V3 liquidity reconstruction and LP replay"
requires-python = ">=3.11"
dependencies = ["eth-abi>=5.1", "numpy>=1.26", "pandas>=2.1", "pydantic>=2.9", "web3>=7.5"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
uniswap_v3_lp_simulator = "lp_simulator.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
