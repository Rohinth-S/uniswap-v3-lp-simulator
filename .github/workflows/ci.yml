name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install '.[test]'
      - run: python -m pytest -q
      - run: uniswap_v3_lp_simulator --output /tmp/report.json --ledger /tmp/ledger.csv --width-candidates 400 600 900
